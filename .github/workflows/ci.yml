name: WEBPLAY CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py app_streaming.py buscador_mundial.py motor_ia_global.py public_domain_catalog.py api/index.py
      - run: python - <<'PY'
        from pathlib import Path
        required = ['templates/index.html', 'templates/admin.html', 'templates/originais.html', 'vercel.json', 'motor_ia_global.py', 'public_domain_catalog.py']
        missing = [p for p in required if not Path(p).is_file()]
        assert not missing, f'Missing required files: {missing}'
        html = Path('templates/index.html').read_text(encoding='utf-8')
        assert 'WEBPLAY' in html
        assert 'BETARUBI 2.0' not in html
        assert 'SpeechRecognition' in html
        assert 'youtube.com/embed' in html
        print('WEBPLAY validation OK')
        PY
