<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BETARUBI 2.0 Admin</title><style>body{font-family:Arial;background:#06060b;color:#fff;padding:20px;max-width:1000px;margin:auto}input,button{padding:10px;margin:5px;border-radius:7px;border:1px solid #333;background:#11111e;color:#fff}button{cursor:pointer;background:#00ff87;color:#000;font-weight:700}.item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #222;padding:10px 0}</style></head><body>{% if login %}<h1>BETARUBI 2.0 — Admin</h1><form method="post"><input type="password" name="password" placeholder="Senha administrativa" required><button>Entrar</button></form>{% if error %}<p>{{error}}</p>{% endif %}{% else %}<h1>Administração de canais</h1><form method="post" action="/admin/channels"><input name="name" placeholder="Nome" required><input name="youtube_channel_id" placeholder="ID YouTube UC..." required><input name="country" placeholder="País" required><button>Adicionar</button></form>{% for c in channels %}<div class="item"><span>{{c.name}} — {{c.country}}</span><form method="post" action="/admin/channels/{{c.id}}/delete"><button>Excluir</button></form></div>{% endfor %}<form method="post" action="/admin/logout"><button>Sair</button></form>{% endif %}</body></html>
