<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BETARUBI 2.0 TV</title>
<style>
:root{--bg:#06060b;--card:#11111e;--hover:#1c1c30;--accent:#00ff87;--muted:#8a8a9e}
*{box-sizing:border-box}body{margin:0;padding:14px;background:var(--bg);color:#fff;font-family:Segoe UI,Arial,sans-serif}button,input{font:inherit}
header{text-align:center;border-bottom:1px solid #202036;padding:12px}.logo{font-size:27px;font-weight:900}.logo span{color:var(--accent);text-shadow:0 0 10px #00ff8766}.search{display:flex;gap:8px;max-width:700px;margin:14px auto}.search input{flex:1;padding:14px;border:2px solid #282842;border-radius:28px;background:#0e0e17;color:white;text-align:center;outline:none}.search input:focus{border-color:var(--accent);box-shadow:0 0 15px #00ff8766}.voice{width:50px;border-radius:50%;background:var(--card);border:2px solid #282842;color:var(--accent);font-size:20px;cursor:pointer}.voice.listening{background:#ff4a6b;color:#fff;border-color:#ff4a6b}
.player{max-width:1000px;margin:24px auto;background:#000;border-radius:16px;overflow:hidden;border:2px solid #202036;box-shadow:0 0 45px #00ff8730}.player.theater{max-width:none;border-radius:0}.ratio{position:relative;padding-bottom:56.25%}.ratio iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.placeholder{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--muted);font-size:18px}.controls{padding:12px;display:flex;justify-content:space-between;gap:10px;background:#0e0e17}.btn,.tab{padding:9px 14px;border:1px solid #30304b;border-radius:8px;background:var(--card);color:#fff;font-weight:700;cursor:pointer}.tab.active,.tab:hover,.btn:hover{background:var(--accent);color:#000}.section{max-width:1400px;margin:22px auto 10px;border-left:4px solid var(--accent);padding-left:9px;text-transform:uppercase}.tabs{max-width:1400px;margin:auto;display:flex;gap:8px;overflow:auto;padding-bottom:10px}.grid{max-width:1400px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:var(--card);border:2px solid #1a1a2e;border-radius:12px;padding:16px;cursor:pointer;outline:none}.card:hover,.card.focused{border-color:var(--accent);box-shadow:0 0 18px #00ff8740;background:var(--hover)}.name{font-weight:700}.meta{display:flex;justify-content:space-between;color:var(--accent);font-size:12px;margin-top:14px}.fav{cursor:pointer;font-size:18px}.fav.on{color:#ffca28;text-shadow:0 0 8px #ffca2866}@media(max-width:600px){body{padding:10px}.logo{font-size:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:11px}.controls{flex-direction:column;text-align:center}}
</style>
</head>
<body>
<header><div class="logo">BETARUBI <span>2.0 TV</span></div><div class="search"><input id="q" aria-label="Buscar canais" placeholder="🔍 Buscar canais, países e categorias"><button id="voice" class="voice" onclick="voz()" title="Buscar por voz">🎙️</button></div></header>
<div class="player" id="player"><div class="ratio"><div id="placeholder" class="placeholder">📺<br>Selecione um canal público ao vivo</div><iframe id="frame" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen hidden></iframe></div><div class="controls"><span id="active">Nenhum canal sintonizado</span><span><button class="btn" onclick="player.classList.toggle('theater')">Modo Teatro</button> <button class="btn" onclick="reload()">Recarregar</button></span></div></div>
<div class="section">Territórios Globais</div><div class="tabs" id="tabs"><button class="tab active" onclick="filtro('TODOS',this)">🌎 Todos</button><button class="tab" onclick="filtro('FAV',this)">⭐ Favoritos (<b id="fc">0</b>)</button>{% for p in countries %}<button class="tab" onclick="filtro({{p|tojson}},this)">{{p}}</button>{% endfor %}</div>
<div class="section">Transmissões Disponíveis</div><div class="grid" id="grid">{% for c in channels %}<article class="card" tabindex="0" data-name="{{c.name|lower}}" data-country="{{c.country}}" data-id="{{c.youtube_channel_id}}" onclick="play({{c.youtube_channel_id|tojson}},{{c.name|tojson}})"><div class="name">{{c.name}}</div><div class="meta"><span>{{c.country}}</span><span class="fav" onclick="fav(event,{{c.youtube_channel_id|tojson}})">★</span></div></article>{% endfor %}</div>
<script>
let cur='',curName='',favset=JSON.parse(localStorage.getItem('br20:fav')||'[]');const $=id=>document.getElementById(id),cards=()=>[...document.querySelectorAll('.card')];
function play(id,name){cur=id;curName=name;$('active').textContent='Sintonizado: '+name;$('placeholder').hidden=true;$('frame').hidden=false;$('frame').src='https://www.youtube.com/embed/live_stream?channel='+encodeURIComponent(id)+'&autoplay=1';window.scrollTo({top:0,behavior:'smooth'})}
function reload(){if(cur)play(cur,curName)}
function fav(e,id){e.stopPropagation();favset=favset.includes(id)?favset.filter(x=>x!==id):[...favset,id];localStorage.setItem('br20:fav',JSON.stringify(favset));$('fc').textContent=favset.length;atualizarEstrelas()}
function atualizarEstrelas(){cards().forEach(c=>c.querySelector('.fav').classList.toggle('on',favset.includes(c.dataset.id)));$('fc').textContent=favset.length)}
function filtro(p,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');cards().forEach(c=>{c.style.display=p==='TODOS'||(p==='FAV'?favset.includes(c.dataset.id):c.dataset.country===p)?'block':'none'})}
$('q').addEventListener('input',e=>{const x=e.target.value.toLowerCase().trim();cards().forEach(c=>c.style.display=(c.dataset.name.includes(x)||c.dataset.country.toLowerCase().includes(x))?'block':'none')});
function voz(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Reconhecimento de voz não suportado neste navegador.');const r=new R();$('voice').classList.add('listening');r.lang='pt-BR';r.onresult=e=>{$('q').value=e.results[0][0].transcript;$('q').dispatchEvent(new Event('input'))};r.onend=()=>$('voice').classList.remove('listening');r.onerror=()=>$('voice').classList.remove('listening');r.start()}
$('grid').addEventListener('keydown',e=>{const a=cards(),i=a.indexOf(document.activeElement);if(i<0)return;let n=i;if(e.key==='ArrowRight')n=Math.min(i+1,a.length-1);if(e.key==='ArrowLeft')n=Math.max(i-1,0);if(e.key==='ArrowDown')n=Math.min(i+2,a.length-1);if(e.key==='ArrowUp')n=Math.max(i-2,0);if(e.key==='Enter'){document.activeElement.click();return}if(n!==i){e.preventDefault();a[n].focus();a[n].classList.add('focused');a.forEach((x,j)=>j!==n&&x.classList.remove('focused'))}});document.addEventListener('DOMContentLoaded',atualizarEstrelas);
</script></body></html>
